name: Lint

# Status Check Name :
# - "lint"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: only read the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
