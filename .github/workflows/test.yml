name: Tests

# Status Check Name :
# - "test"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
